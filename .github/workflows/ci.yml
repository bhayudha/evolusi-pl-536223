name: Laravel CI/CD

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  # JOB 1: Menjalankan Test bawaan Laravel (PHPUnit/Pest)
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4' # Sesuaikan dengan versi PHP Anda
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, dom, filter, libxml, tokenizer, session

      - name: Install Composer Dependencies
        run: composer update --no-interaction --no-progress --prefer-dist --no-scripts  

      - name: Prepare Laravel Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Create SQLite Database
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Run Tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan test

  # JOB 2: Memastikan aset Frontend bisa di-build dengan Node.js
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Assets
        run: npm run build